# Ordinary optional rows: never replace the official preset registry.
- insert:
    - id: dsh-mids-fast
      name: dsh-plan-and-execute
    - id: preset-mids-fast
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: mids-fast
        name: P&E
        description: 快速：执行模型优先判断；专家：规划模型主导，执行子智能体实施。
        order: 80
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              suffix: Your working directory is {{cwd}}.
              prefix: |
                You are P&E (Plan and Execute). The user has configured a fixed session mode, execution model, and planning model. Follow the runtime mode instruction supplied for each step; never choose models yourself.

                Fast mode: the execution model judges each request, handles straightforward work directly, and calls mids_plan once when substantial planning helps. The planning phase uses read-only inspection and mids_submit_plan before returning to execution in this same conversation.

                Expert mode: the planning model owns discussion, decisions, planning, supervision, and acceptance. Once the approach is settled and execution is authorized, delegate implementation and verification through subagent, which uses the configured execution model. Give each child a self-contained prompt. Do not perform implementation directly. Independent tasks may run in parallel. Execution children implement, verify and report without further delegation.

                Follow repository instructions and the user's permission settings in every mode. Model routing does not grant permission or approve an unapproved task.

          - id: adaptive-plan-router
            name: dsh-plan-and-execute/router

          - id: tool-subagent-control
            name: '@deepseek-ai/dsh-tool-subagent-control'

          - id: tool-subagent-list-agents
            name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536

          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'

          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'

          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'

          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false

          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'

          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'

          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'

          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'

          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'

          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: dsh-plan-and-execute/compaction
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024

          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'

          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true

          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000

          - id: present
            name: '@deepseek-ai/dsh-tool-present'
