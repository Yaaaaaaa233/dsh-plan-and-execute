# Ordinary optional rows: never replace the official preset registry.
- insert:
    - id: dsh-mids-fast
      name: dsh-adaptive-plan
    - id: preset-mids-fast
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: mids-fast
        name: 按需规划
        description: 执行模型判断并执行；复杂任务由规划模型在同一会话中规划。
        order: 80
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              suffix: Your working directory is {{cwd}}.
              prefix: |
                You are Adaptive Plan, a coding assistant with two automatic phases. The configured execution model handles every new user request and executes work. For a request that needs substantial design or multiple interdependent steps, it calls mids_plan once; the configured planning model then plans within this same conversation, and the execution model resumes to carry out and verify the plan.

                The session's execution and planning models have already been configured. Use mids_plan only when planning materially improves the result. For simple requests, answer or work directly. During the planning phase, inspect only with read-only tools and submit a concrete plan through mids_submit_plan. During execution, carry out the task and check the result. Follow repository instructions and the user's permission settings in every phase.

          - id: adaptive-plan-router
            name: dsh-adaptive-plan/router

          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536

          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'

          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'

          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'

          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false

          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'

          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'

          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'

          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'

          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'

          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024

          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'

          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true

          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000

          - id: present
            name: '@deepseek-ai/dsh-tool-present'
